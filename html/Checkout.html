<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
     <header>
        <div>
            <p>Du grain à votre tasse. Un café qui vous ressemble.</p>
        </div>
        <div>
            <span id="logo">
                <i class="fa-solid fa-mug-hot"></i>
                <h1 class="previous">BRUME</h1>
            </span>
            <nav>
                <a href="#">L’atelier café</a>
                <a href="#">Notre savoir-faire </a>
                <a href="#"> Besoin d’aide ?</a>
            </nav>
            <span >
                <i  class="fa-solid fa-bag-shopping next"></i>
                <p id="Conteur">0</p>
            </span>
        </div>
    </header>
    <main>
          
          <section class="section-7">
            <!-- <img src="../assets/image2.png" alt="image repesentative pour le site" > -->
            <section class="section-5">
                <h4>Mon Panier</h4>
                <div class="commandes">
                
              </div>
           
            <button type="button" class="ajoute"> ajouter un choix</button>
            <dialog id="myDialog"  class="search"> 
                <div>
                    <label for="chercher">
                        chercher votre produits
                    </label>
                    <input type="search" id="chercher"  placeholder="Rechercher...">
                    <div id="results"></div>
                  
                </div>
               
            </dialog>
            <h2  id="Total">TOTAL:50DH</h2>
            </section>
            <section class="Payement">
            <form>
            <fieldset>
                <legend>Payement de votre Commande</legend>
                <label for="fname">Prenom
                <input type="text" id="fname"  class="name" required></label>
                <label for="lname">Nom
                <input type="text" id ="lname"   class="name" required></label>
                <label for="adresse">adresse
                <input type="text" id="adresse" required></label>
                <label for="email">Email
                <input type="text" id="email" required></label>
                <label for="tele">Numero de telephone 
                <input type="text" id="tele" required></label>
                <label for="Carteb">numéro de carte bancaire
                <input type="text" id="Carteb" required></label>
                <label for="dateexp">Date d'expiration 
                <input type="text" id="dateexp" required></label>
                <label for="CVV"> CVV
                <input type="text" id="CVV"></label>
                <button type="submit" id="payer">payer</button>
            </fieldset>
          </form>
          </section>  
          </section>
          
          
          
    </main>
    <footer>
        <p>BRUME — Le goût de votre rythme</p>
        <p>Une création unique, la vôtre</p>
    </footer>
    <script src="../javaScript/scriptCheckout.js"></script>
</body>
</html>
