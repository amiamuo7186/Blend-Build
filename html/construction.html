<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>construction</title>
     <link rel="stylesheet" href="../css/output.css">

</head>

<body>
     <!-- Progress Bar -->
     <div class="mx-auto mb-10 flex max-w-4xl items-center">
          <div class="flex flex-1 flex-col items-center">
               <div div
                    class=" Style-Number flex h-12 w-12 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-gray-600">
                    1</div>
               <span class="mt-3 text-center text-sm font-semibold text-emerald-900">Informations générales</span>
          </div>
          <div class="h-0.5 flex-1 bg-gray-300"></div>
          <div class="flex flex-1 flex-col items-center">
               <div id="2"
                    class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-gray-600">
                    2</div>
               <span class="mt-3 text-center text-sm text-emerald-900">Caractéristiques</span>
          </div>
          <div class="h-0.5 flex-1 bg-gray-300"></div>
          <div class="flex flex-1 flex-col items-center">
               <div id="3" class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-gray-600">
                    3</div>
               <span class="mt-3 text-center text-sm text-emerald-900">Récapitulatif</span>
          </div>
     </div>

     <form class="flex flex-col gap-6 p-6 bg-[#FAF7F0]">
          <!-- Informations Générales -->

          <section id="Informations" class="flex flex-col gap-4 p-6 bg-white rounded-xl m-100 mt-0 mb-0">
               <div class="flex flex-col gap-2">
                    <label for="base" class="text-sm font-medium text-[#30291F]">Nom de la boisson
                         <input type="text" id="base" class="w-full p-2 border border-[#796A59] rounded-lg"
                              placeholder="EX:Espresso">
                    </label>
                    <label for="PrixB" class="text-sm font-medium text-[#30291F]">Prix de base
                         <input type="number" min="0" step="0.01" id="PrixB"
                              class="w-full p-2 border border-[#796A59] rounded-lg" placeholder="EX:18.00 DH">
                    </label>
                    <label for="des" class="text-sm font-medium text-[#30291F]">Description
                         <textarea id="des" class="w-full p-2 border border-[#796A59] rounded-lg"
                              placeholder="description :"></textarea>
                    </label>
                    <label for="img" class="text-sm font-medium text-[#30291F]">Image du produit
                         <input type="url" id="img" class="w-full p-2 border border-[#796A59] rounded-lg"
                              placeholder="poser l'url de votre image ">
                    </label>
                    <div class="flex flex-col gap-6">
                         <label class="text-sm font-medium text-[#30291F]">Produit en promotion:
                              <input type="checkbox" id="existeP" name="exicte" value="option1"
                                   class="w-4 h-4 accent-[#394B32]"> OUI
                              <!-- <input type="checkbox" name="exicte" value="option2">NON -->
                    </div>
                    <div id="Promo" class="hidden">
                         <label for="reduction" class="text-sm font-medium text-[#30291F]">Pourcentage de réduction
                              <input type="number" id="reduction" min="10" max="100"
                                   class="w-full p-2 border border-[#796A59] rounded-lg" placeholder="50%">
                         </label>
                         <label for="dateF" class="text-sm font-medium text-[#30291F]"> Date de fin
                              <input type="date" id="dateF" class="w-full p-2 border border-[#796A59] rounded-lg"
                                  >
                         </label>
                    </div>


                    </label>
                    <button type="button" class="bg-green-900 h-8 text-amber-50 cursor-pointer"
                         id="next1">suivant</button>
               </div>

          </section>
          <!-- Caractéristiques & Options -->
          <section id="Caractéristiques" class=" flex flex-col gap-6 p-6 bg-[#FAF7F0] m-100 mt-0 mb-0" hidden>
               <label for="Origine" class="text-sm font-medium text-[#30291F]">Origine des grains:
                    <select class="w-full p-2 border border-[#796A59] rounded-lg" name="origineGrains" id="Origine">
                         <option value="">choisir un choix</option>
                         <option value="Colombie">Colombie</option>
                         <option value="Éthiopie">Éthiopie</option>
                         <option value="Brésil"> Brésil</option>
                         <option value="Mélange Maison">Mélange Maison</option>
                    </select>
               </label>
               <label for="niveaIntensite" class="text-sm font-medium text-[#30291F]">Niveau de torréfaction:
                    <input id="niveaIntensite" type="range" min="0" max="10" value="">
               </label>
               <label id="tempe" class="text-sm font-medium text-[#30291F]">Température
                    <label for="chaud" class="text-sm font-medium text-[#30291F]">
                         <input type="radio" id="chaud" name="temp" value="chaud">Chaud
                    </label>
                    <label for="glacé" class="text-sm font-medium text-[#30291F]">
                         <input type="radio" id="glacé" name="temp" value="glace"> Glacé
                    </label>
               </label>
               <label id="taille" class="text-sm font-medium text-[#30291F]">Tailles disponibles:
                    <label for="s" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox"  value="Small" name="taille" id="s">Small
                    </label>
                    <label for="m" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" value="Medium" name="taille" id="m">Medium
                    </label>
                    <label for="l" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" value="Large" name="taille" id="l">Large
                    </label>
               </label>
               <label id="lait" class="text-sm font-medium text-[#30291F]">Options de lait:
                    <label for="vache" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" name="lait" id="vache" value="Vache">Vache
                    </label>
                    <label for="Avoine" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" name="lait" id="Avoine" value="Avoine">Avoine
                    </label>
                    <label for="Soja" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" name="lait" id="Soja" value="Soja">Soja
                    </label>
                    <label for="Amande">
                         <input type="checkbox" name="lait" id="Amande" value="Amande">Amande
                    </label>
               </label>
               <label id="supplements" class="text-sm font-medium text-[#30291F]">Suppléments
                    <label for="vanille" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" name="supplements" id="vanille" value="Vanille">Vanille
                    </label>
                    <label for="caramel" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" name="supplements" id="caramel" value="Caramel">Caramel
                    </label>
                    <label for="noisette" class="text-sm font-medium text-[#30291F]">
                         <input type="checkbox" name="supplements" id="noisette" value="Noisette">Noisette
                    </label>
               </label>
               <div class="flex justify-between ">
                    <button type="button" id="previous2"  class="bg-[#394B32] text-white px-6 py-2 rounded-lg cursor-pointer ">Previous</button>
                    <button type="button" id="next2"  class="bg-[#394B32] text-white px-6 py-2 rounded-lg cursor-pointer ">Suivant</button>
               </div>
          </section>
          <!-- Récapitulatif -->
          <section id="recapitalatif" class="  flex flex-col gap-6 p-6 bg-[#FAF7F0] m-100 mt-0 mb-0"hidden>
               <div id="resume"></div>
               <p id="desc"></p>
               <div id ="promotions"></div>
               <div class="flex justify-between ">
                    <button type="button" id="previous3"  class="bg-[#394B32] text-white px-6 py-2 rounded-lg cursor-pointer ">Previous</button>
                    <button type="submit" id="next3"  class="bg-[#394B32] text-white px-6 py-2 rounded-lg cursor-pointer ">Suivant</button>
               </div>
          </section>

     </form>
     <script src="../javaScript/construction.js "></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
